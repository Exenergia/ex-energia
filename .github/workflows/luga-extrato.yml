name: Luga - Extrato de Faturamentos

on:
  workflow_dispatch:

jobs:
  extrato:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx puppeteer browsers install chrome

      - name: Baixar e gravar faturamentos da Luga
        env:
          LUGA_EMAIL: ${{ secrets.LUGA_EMAIL }}
          LUGA_PASSWORD: ${{ secrets.LUGA_PASSWORD }}
        run: node automation/luga-extrato.mjs

      - name: Upload downloads
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luga-downloads
          path: downloads/
