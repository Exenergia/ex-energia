name: Teste Login Economy Energy

on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx puppeteer browsers install chrome

      - name: Testar login Economy Energy
        env:
          ECONOMY_EMAIL: ${{ secrets.ECONOMY_EMAIL }}
          ECONOMY_PASSWORD: ${{ secrets.ECONOMY_PASSWORD }}
        run: node automation/economy-login.mjs

      - name: Upload downloads
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economy-downloads
          path: downloads/
