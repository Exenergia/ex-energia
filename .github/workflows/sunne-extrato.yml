name: Sunne - Extrato Detalhado

on:
  workflow_dispatch:

jobs:
  extrato:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx puppeteer browsers install chrome

      - name: Importar todos os meses
        env:
          SUNNE_EMAIL: ${{ secrets.SUNNE_EMAIL }}
          SUNNE_PASSWORD: ${{ secrets.SUNNE_PASSWORD }}
        run: node automation/sunne-extrato.mjs

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloads
          path: downloads/
